
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOOTBALL LEGENDS</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #07111c;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

#app {
  width: 100vw;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(ellipse at center, #142d42, #050b12);
}

header {
  width: min(100%, 1100px);
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 20px;
}

.logo {
  font-size: 23px;
  font-weight: 900;
  letter-spacing: 2px;
}

.logo span {
  color: #37e78a;
}

#scoreboard {
  display: flex;
  align-items: center;
  gap: 16px;
  background: #111e2b;
  border: 1px solid #294158;
  border-radius: 12px;
  padding: 10px 20px;
  font-weight: bold;
}

.score {
  font-size: 25px;
  color: #37e78a;
}

#clock {
  color: #a8c2d8;
  font-size: 13px;
}

#gameContainer {
  position: relative;
  width: min(96vw, 1050px);
  aspect-ratio: 1000 / 620;
  max-height: 76vh;
  border: 2px solid #34536b;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 15px 60px #000a;
  background: #176b43;
}

canvas {
  width: 100%;
  height: 100%;
  display: block;
}

#overlay {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #020a13dc;
  z-index: 5;
}

.panel {
  width: min(90%, 430px);
  text-align: center;
  background: linear-gradient(145deg,#172d40,#0b1725);
  padding: 35px 25px;
  border: 1px solid #31536a;
  border-radius: 18px;
  box-shadow: 0 15px 50px #0008;
}

.panel h1 {
  font-size: 35px;
  letter-spacing: 2px;
}

.panel h1 span {
  color: #37e78a;
}

.panel p {
  color: #a8bfd0;
  margin: 14px 0 22px;
  line-height: 1.6;
}

button {
  border: 0;
  cursor: pointer;
  color: #07140e;
  background: #37e78a;
  font-weight: bold;
  border-radius: 9px;
  padding: 14px 30px;
  font-size: 15px;
  transition: .2s;
}

button:hover {
  background: #72ffb2;
  transform: scale(1.04);
}

#controls {
  width: min(96vw, 1050px);
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 5px;
  color: #9eb8cb;
  font-size: 12px;
}

#mobileControls {
  display: none;
  gap: 12px;
  align-items: center;
  padding: 8px;
}

.pad {
  display: grid;
  grid-template-columns: repeat(3, 43px);
  grid-template-rows: repeat(2, 43px);
  gap: 4px;
}

.pad button, .actionButtons button {
  padding: 5px;
  background: #20384d;
  color: white;
  border: 1px solid #426078;
  touch-action: none;
}

.pad button:active, .actionButtons button:active {
  background: #37e78a;
  color: black;
}

.actionButtons {
  display: flex;
  gap: 6px;
}

.actionButtons button {
  width: 53px;
  height: 48px;
}

@media(max-width:650px) {
  header { padding: 7px; }
  .logo { font-size: 15px; }
  #scoreboard { padding: 7px; gap: 8px; }
  #controls { display: none; }
  #mobileControls { display: flex; }
  #gameContainer { width: 98vw; }
}
</style>
</head>

<body>

<div id="app">

<header>
  <div class="logo">FOOTBALL <span>LEGENDS</span></div>

  <div id="scoreboard">
    <span>BLUE</span>
    <span class="score" id="blueScore">0</span>
    <span>-</span>
    <span class="score" id="redScore">0</span>
    <span>RED</span>
    <span id="clock">02:00</span>
  </div>
</header>

<div id="gameContainer">

<canvas id="game" width="1000" height="620"></canvas>

<div id="overlay">
  <div class="panel">
    <h1>FOOTBALL <span>LEGENDS</span></h1>
    <p id="message">
      5 VS 5 · MODO PARTIDO<br>
      Enfrentate a la inteligencia artificial.<br>
      Dominá la cancha y ganá el partido.
    </p>
    <button id="startButton">JUGAR PARTIDO</button>
  </div>
</div>

</div>

<div id="controls">
  <span>WASD / FLECHAS: MOVER</span>
  <span>SHIFT: CORRER</span>
  <span>J: PASE</span>
  <span>K: DISPARO</span>
  <span>Q: CAMBIAR JUGADOR</span>
  <span>ESC: PAUSA</span>
</div>

<div id="mobileControls">
  <div class="pad">
    <span></span>
    <button data-key="ArrowUp">▲</button>
    <span></span>
    <button data-key="ArrowLeft">◀</button>
    <button data-key="ArrowDown">▼</button>
    <button data-key="ArrowRight">▶</button>
  </div>

  <div class="actionButtons">
    <button data-key="j">PASE</button>
    <button data-key="k">TIRO</button>
    <button data-key="Shift">SPRINT</button>
  </div>
</div>

</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = 1000;
const H = 620;

const keys = {};
let blueScore = 0;
let redScore = 0;
let timeLeft = 120;
let running = false;
let paused = false;
let gameEnded = false;
let lastTime = 0;
let selected = 1;
let goalMessage = "";
let goalTimer = 0;
let kickCooldown = 0;

const blue = [];
const red = [];

const ball = {
  x: 500,
  y: 310,
  vx: 0,
  vy: 0,
  radius: 8,
  owner: null
};

const formationsBlue = [
  [500,535],
  [350,410],
  [650,410],
  [420,270],
  [580,270]
];

const formationsRed = [
  [500,85],
  [350,210],
  [650,210],
  [420,350],
  [580,350]
];

function createTeam(team, formations) {
  return formations.map((p,i) => ({
    x:p[0],
    y:p[1],
    homeX:p[0],
    homeY:p[1],
    vx:0,
    vy:0,
    team,
    number:i===0?1:i+6,
    speed:i===0?115:150,
    radius:15,
    keeper:i===0
  }));
}

function initialize() {
  blue.length=0;
  red.length=0;
  blue.push(...createTeam("blue",formationsBlue));
  red.push(...createTeam("red",formationsRed));
  selected=1;
  resetBall();
}

function resetBall() {
  ball.x=500;
  ball.y=310;
  ball.vx=0;
  ball.vy=0;
  ball.owner=null;
  blue.forEach(p=>{p.x=p.homeX;p.y=p.homeY;p.vx=0;p.vy=0});
  red.forEach(p=>{p.x=p.homeX;p.y=p.homeY;p.vx=0;p.vy=0});
}

function distance(a,b) {
  return Math.hypot(a.x-b.x,a.y-b.y);
}

function clamp(v,min,max) {
  return Math.max(min,Math.min(max,v));
}

function perspective(y) {
  return 0.78 + 0.22*y/H;
}

function screenX(x,y) {
  return 500+(x-500)*perspective(y);
}

function screenY(y) {
  return 60+y*.83;
}

function drawField() {
  const top=60;
  const bottom=574;

  ctx.fillStyle="#10251d";
  ctx.fillRect(0,0,W,H);

  // Cancha en perspectiva
  ctx.beginPath();
  ctx.moveTo(220,top);
  ctx.lineTo(780,top);
  ctx.lineTo(960,bottom);
  ctx.lineTo(40,bottom);
  ctx.closePath();

  const gradient=ctx.createLinearGradient(0,top,0,bottom);
  gradient.addColorStop(0,"#278653");
  gradient.addColorStop(1,"#17663c");
  ctx.fillStyle=gradient;
  ctx.fill();

  // Franjas
  for(let i=0;i<10;i++) {
    ctx.beginPath();
    let y1=top+i*51.4;
    let y2=y1+51.4;
    let f1=(y1-top)/(bottom-top);
    let f2=(y2-top)/(bottom-top);
    let left1=220-180*f1;
    let right1=780+180*f1;
    let left2=220-180*f2;
    let right2=780+180*f2;

    ctx.moveTo(left1,y1);
    ctx.lineTo(right1,y1);
    ctx.lineTo(right2,y2);
    ctx.lineTo(left2,y2);
    ctx.closePath();

    ctx.fillStyle=i%2===0?"#ffffff08":"#00000008";
    ctx.fill();
  }

  function line(x1,y1,x2,y2) {
    ctx.beginPath();
    ctx.moveTo(screenX(x1,y1),screenY(y1));
    ctx.lineTo(screenX(x2,y2),screenY(y2));
    ctx.stroke();
  }

  ctx.strokeStyle="#ffffffc9";
  ctx.lineWidth=2;

  // Límites
  ctx.beginPath();
  ctx.moveTo(220,top);
  ctx.lineTo(780,top);
  ctx.lineTo(960,bottom);
  ctx.lineTo(40,bottom);
  ctx.closePath();
  ctx.stroke();

  // Mitad
  line(500,0,500,620);

  // Círculo central
  ctx.beginPath();
  ctx.ellipse(500,screenY(310),105,43,0,0,Math.PI*2);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(500,screenY(310),4,0,Math.PI*2);
  ctx.fillStyle="white";
  ctx.fill();

  // Áreas
  function area(y,width,depth) {
    let direction=y<310?1:-1;
    let x1=500-width/2;
    let x2=500+width/2;
    let end=y+direction*depth;

    line(x1,y,x2,y);
    line(x1,y,x1,end);
    line(x2,y,x2,end);
    line(x1,end,x2,end);
  }

  area(60,320,95);
  area(560,320,95);

  area(60,150,45);
  area(605,150,45);

  // Arcos
  ctx.strokeStyle="#ffffff";
  ctx.lineWidth=4;

  ctx.strokeRect(420,screenY(60)-20,160,20);
  ctx.strokeRect(420,screenY(620)+0,160,0);

  // Arco inferior
  ctx.beginPath();
  ctx.moveTo(screenX(420,620),screenY(620));
  ctx.lineTo(screenX(580,620),screenY(620));
  ctx.stroke();

  // Áreas de arco
  ctx.lineWidth=2;
  ctx.strokeStyle="#ffffff80";
}

function drawGoal() {
  // Arco superior
  ctx.fillStyle="#dce8f1";
  ctx.fillRect(420,screenY(60)-23,160,5);
  ctx.fillRect(420,screenY(60)-23,5,24);
  ctx.fillRect(575,screenY(60)-23,5,24);

  // Arco inferior
  ctx.fillRect(420,screenY(620),160,5);
}

function drawPlayer(p,index) {
  const sx=screenX(p.x,p.y);
  const sy=screenY(p.y);
  const scale=perspective(p.y);

  const r=p.radius*scale;

  // Sombra
  ctx.beginPath();
  ctx.ellipse(sx+2,sy+8,r*1.1,r*.48,0,0,Math.PI*2);
  ctx.fillStyle="#0007";
  ctx.fill();

  // Cuerpo
  const gradient=ctx.createRadialGradient(
    sx-r*.4,sy-r*.5,2,sx,sy,r*1.4
  );

  if(p.team==="blue") {
    gradient.addColorStop(0,"#70dfff");
    gradient.addColorStop(1,"#0751b9");
  } else {
    gradient.addColorStop(0,"#ff9d9d");
    gradient.addColorStop(1,"#b51232");
  }

  ctx.beginPath();
  ctx.arc(sx,sy,r,0,Math.PI*2);
  ctx.fillStyle=gradient;
  ctx.fill();

  ctx.strokeStyle="#ffffff";
  ctx.lineWidth=2;
  ctx.stroke();

  // Cabeza
  ctx.beginPath();
  ctx.arc(sx,sy-r*.55,r*.48,0,Math.PI*2);
  ctx.fillStyle="#f3c49a";
  ctx.fill();

  // Número
  ctx.fillStyle="white";
  ctx.font=`bold ${Math.max(9,12*scale)}px Arial`;
  ctx.textAlign="center";
  ctx.fillText(p.number,sx,sy+4);

  // Selección
  if(p===blue[selected] && running) {
    ctx.beginPath();
    ctx.arc(sx,sy,r+7,0,Math.PI*2);
    ctx.strokeStyle="#67ffae";
    ctx.lineWidth=3;
    ctx.stroke();

    ctx.fillStyle="#67ffae";
    ctx.font="bold 12px Arial";
    ctx.fillText("▼",sx,sy-r-12);
  }
}

function drawBall() {
  const x=screenX(ball.x,ball.y);
  const y=screenY(ball.y);

  const elevation=Math.min(40,Math.hypot(ball.vx,ball.vy)*.035);
  const r=ball.radius*perspective(ball.y);

  ctx.beginPath();
  ctx.ellipse(x+3,y+7,r*1.3,r*.6,0,0,Math.PI*2);
  ctx.fillStyle="#0008";
  ctx.fill();

  ctx.beginPath();
  ctx.arc(x,y-elevation,r,0,Math.PI*2);
  ctx.fillStyle="#fff";
  ctx.fill();
  ctx.strokeStyle="#222";
  ctx.lineWidth=1.5;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(x,y-elevation,r*.35,0,Math.PI*2);
  ctx.fillStyle="#151515";
  ctx.fill();
}

function draw() {
  drawField();
  drawGoal();

  const players=[...blue,...red].sort((a,b)=>a.y-b.y);
  players.forEach((p,i)=>drawPlayer(p,i));

  drawBall();

  if(goalTimer>0) {
    ctx.fillStyle="#00100bd9";
    ctx.fillRect(0,220,W,130);

    ctx.fillStyle="#47ff9b";
    ctx.font="bold 55px Arial";
    ctx.textAlign="center";
    ctx.fillText(goalMessage,W/2,300);

    ctx.font="16px Arial";
    ctx.fillStyle="white";
    ctx.fillText("¡QUÉ GOLAZO!",W/2,330);
  }

  if(paused && running) {
    ctx.fillStyle="#0009";
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle="white";
    ctx.font="bold 50px Arial";
    ctx.textAlign="center";
    ctx.fillText("PAUSA",W/2,H/2);
  }
}

function movePlayer(p,dx,dy,speed,dt) {
  const len=Math.hypot(dx,dy);

  if(len>0) {
    dx/=len;
    dy/=len;
  }

  p.x+=dx*speed*dt;
  p.y+=dy*speed*dt;

  p.x=clamp(p.x,75,925);
  p.y=clamp(p.y,20,600);
}

function nearestPlayer(team,target) {
  let best=team[1];
  let dist=Infinity;

  for(let i=1;i<team.length;i++) {
    let d=distance(team[i],target);
    if(d<dist) {
      dist=d;
      best=team[i];
    }
  }

  return best;
}

function controlHuman(dt) {
  const p=blue[selected];
  if(!p)return;

  let dx=0,dy=0;

  if(keys["w"]||keys["ArrowUp"])dy--;
  if(keys["s"]||keys["ArrowDown"])dy++;
  if(keys["a"]||keys["ArrowLeft"])dx--;
  if(keys["d"]||keys["ArrowRight"])dx++;

  let speed=keys["Shift"]?240:165;

  movePlayer(p,dx,dy,speed,dt);
}

function moveAI(team,opponents,dt,isRed) {
  for(let i=1;i<team.length;i++) {
    const p=team[i];
    const attackDirection=isRed?1:-1;

    let targetX=p.homeX;
    let targetY=p.homeY;

    const closest=nearestPlayer(team,ball);

    if(ball.owner && ball.owner.team===p.team) {
      targetX=p.homeX+(ball.x-500)*.3;
      targetY=p.homeY+(ball.y-p.homeY)*.18;
    } else if(closest===p || !ball.owner) {
      targetX=ball.x;
      targetY=ball.y;
    } else {
      targetX=p.homeX+(ball.x-500)*.2;
      targetY=p.homeY+(ball.y-p.homeY)*.15;
    }

    const dx=targetX-p.x;
    const dy=targetY-p.y;
    const dist=Math.hypot(dx,dy);

    if(dist>9) {
      movePlayer(p,dx,dy,dist>80?125:90,dt);
    }

    p.x=clamp(p.x,75,925);
    p.y=clamp(p.y,20,600);
  }
}

function goalkeeperAI(p,dt,isRed) {
  let targetX=clamp(ball.x,430,570);
  let targetY=isRed?80:540;

  if(isRed && ball.y<230)targetY=110;
  if(!isRed && ball.y>390)targetY=510;

  movePlayer(
    p,
    targetX-p.x,
    targetY-p.y,
    115,
    dt
  );
}

function handleBall(dt) {
  if(ball.owner) {
    const p=ball.owner;

    const direction=p.team==="blue"?-1:1;
    ball.x=p.x;
    ball.y=p.y+direction*19;
    ball.vx=0;
    ball.vy=0;
    return;
  }

  ball.x+=ball.vx*dt;
  ball.y+=ball.vy*dt;

  ball.vx*=Math.pow(.985,dt*60);
  ball.vy*=Math.pow(.985,dt*60);

  if(Math.abs(ball.vx)<3)ball.vx=0;
  if(Math.abs(ball.vy)<3)ball.vy=0;

  // Paredes laterales
  if(ball.x<65 || ball.x>935) {
    ball.x=clamp(ball.x,65,935);
    ball.vx*=-.7;
  }

  // Límites de cancha
  if(ball.y<15 && !(ball.x>420&&ball.x<580)) {
    ball.y=15;
    ball.vy*=-.65;
  }

  if(ball.y>605 && !(ball.x>420&&ball.x<580)) {
    ball.y=605;
    ball.vy*=-.65;
  }

  // Gol azul
  if(ball.y<45 && ball.x>420 && ball.x<580) {
    redScore++;
    goal("¡GOL DEL ROJO!");
    return;
  }

  // Gol rojo
  if(ball.y>575 && ball.x>420 && ball.x<580) {
    blueScore++;
    goal("¡GOOOOOOL!");
    return;
  }

  // Recuperación de pelota
  let closest=null;
  let min=24;

  for(const p of [...blue,...red]) {
    const d=distance(p,ball);
    if(d<min) {
      min=d;
      closest=p;
    }
  }

  if(closest) {
    ball.owner=closest;
    ball.vx=0;
    ball.vy=0;
  }
}

function kick(player,dx,dy,power) {
  if(!player)return;

  ball.owner=null;

  const len=Math.hypot(dx,dy)||1;
  ball.x=player.x+dx/len*23;
  ball.y=player.y+dy/len*23;

  ball.vx=dx/len*power;
  ball.vy=dy/len*power;

  kickCooldown=.25;
}

function passBall() {
  const p=blue[selected];

  if(!p || ball.owner!==p)return;

  let target=null;
  let best=-Infinity;

  blue.forEach((teammate,i)=>{
    if(teammate===p)return;

    const dx=teammate.x-p.x;
    const dy=teammate.y-p.y;

    const score=(-dy)*1.4-Math.abs(dx)*.2;

    if(score>best) {
      best=score;
      target=teammate;
    }
  });

  if(target) {
    kick(p,target.x-p.x,target.y-p.y,340);
  }
}

function shootBall() {
  const p=blue[selected];

  if(!p || ball.owner!==p)return;

  const dx=500-p.x;
  const dy=-650;

  kick(p,dx,dy,590);
}

function enemyActions(dt) {
  red.forEach(p=>{
    if(p.keeper)return;

    if(ball.owner===p) {
      if(p.y>150) {
        kick(p,500-p.x,650,410);
      }
    } else if(!ball.owner && distance(p,ball)<23) {
      ball.owner=p;
    }
  });

  // Portero azul
  if(!ball.owner && distance(blue[0],ball)<27) {
    ball.owner=blue[0];
  }

  // Portero rojo
  if(!ball.owner && distance(red[0],ball)<27) {
    ball.owner=red[0];
  }
}

function goal(message) {
  goalMessage=message;
  goalTimer=2;
  ball.owner=null;
  ball.vx=0;
  ball.vy=0;
  kickCooldown=.3;

  updateScore();

  setTimeout(()=>{
    if(running && !gameEnded)resetBall();
  },1400);
}

function updateScore() {
  document.getElementById("blueScore").textContent=blueScore;
  document.getElementById("redScore").textContent=redScore;
}

function updateClock() {
  const m=Math.floor(timeLeft/60);
  const s=Math.floor(timeLeft%60);

  document.getElementById("clock").textContent=
    String(m).padStart(2,"0")+":"+
    String(s).padStart(2,"0");
}

function finishGame() {
  running=false;
  gameEnded=true;

  let result="EMPATE";

  if(blueScore>redScore)result="¡VICTORIA!";
  if(blueScore<redScore)result="DERROTA";

  document.getElementById("message").innerHTML=
    result+"<br>Resultado final: "+blueScore+
    " - "+redScore;

  document.getElementById("startButton").textContent=
    "JUGAR DE NUEVO";

  document.getElementById("overlay").style.display="flex";
}

function update(dt) {
  if(!running || paused)return;

  if(goalTimer>0)goalTimer-=dt;
  if(kickCooldown>0)kickCooldown-=dt;

  timeLeft-=dt;

  if(timeLeft<=0) {
    timeLeft=0;
    updateClock();
    finishGame();
    return;
  }

  updateClock();

  controlHuman(dt);

  moveAI(blue,red,dt,false);
  moveAI(red,blue,dt,true);

  goalkeeperAI(red[0],dt,true);
  goalkeeperAI(blue[0],dt,false);

  // Robo y control de pelota
  if(ball.owner) {
    const owner=ball.owner;
    const rivals=owner.team==="blue"?red:blue;

    for(const rival of rivals) {
      if(distance(rival,owner)<24) {
        ball.owner=null;
        ball.vx=(owner.x-rival.x)*4;
        ball.vy=(owner.y-rival.y)*4;
        break;
      }
    }
  }

  handleBall(dt);
  enemyActions(dt);
}

function loop(timestamp) {
  const dt=Math.min((timestamp-lastTime)/1000||0,.04);
  lastTime=timestamp;

  update(dt);
  draw();

  requestAnimationFrame(loop);
}

function startGame() {
  blueScore=0;
  redScore=0;
  timeLeft=120;
  gameEnded=false;
  paused=false;

  initialize();
  updateScore();
  updateClock();

  running=true;
  document.getElementById("overlay").style.display="none";
}

document.getElementById("startButton").addEventListener("click",startGame);

document.addEventListener("keydown",e=>{
  const k=e.key.length===1?e.key.toLowerCase():e.key;

  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))
    e.preventDefault();

  if(!keys[k]) {
    if(k==="j")passBall();
    if(k==="k")shootBall();

    if(k==="q") {
      selected=(selected%4)+1;
    }

    if(k==="Escape" && running) {
      paused=!paused;
    }
  }

  keys[k]=true;
});

document.addEventListener("keyup",e=>{
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  keys[k]=false;
});

// Controles táctiles
document.querySelectorAll("[data-key]").forEach(btn=>{
  const key=btn.dataset.key;

  btn.addEventListener("pointerdown",e=>{
    e.preventDefault();

    if(key==="j")passBall();
    else if(key==="k")shootBall();
    else keys[key]=true;
  });

  ["pointerup","pointerleave","pointercancel"].forEach(event=>{
    btn.addEventListener(event,()=>{
      keys[key]=false;
    });
  });
});

initialize();
updateClock();
draw();
requestAnimationFrame(loop);

</script>
</body>
</html>
