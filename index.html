
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FOOTBALL LEGENDS ARCADE</title>
<style>
*{box-sizing:border-box;margin:0}
body{
 background:#07111b;color:white;font-family:Arial;
 display:flex;align-items:center;justify-content:center;
 min-height:100vh;overflow:hidden
}
#app{width:100%;max-width:1100px;padding:10px}
header{
 display:flex;justify-content:space-between;
 align-items:center;padding:12px
}
h1{font-size:22px;letter-spacing:2px}
h1 span{color:#40f5a0}
#score{
 background:#14283a;padding:10px 18px;
 border-radius:12px;font-size:24px;font-weight:bold
}
#score b{color:#43f5a0}
#timer{font-size:15px;color:#a9c4d9}
#arena{
 position:relative;width:100%;aspect-ratio:1000/620;
 border:3px solid #41617a;border-radius:15px;
 overflow:hidden;background:#167b48
}
canvas{width:100%;height:100%;display:block}
#menu{
 position:absolute;inset:0;z-index:3;
 background:#04101ddd;display:flex;
 align-items:center;justify-content:center
}
.panel{
 text-align:center;background:#14283a;
 border:1px solid #3b657b;border-radius:20px;
 padding:35px;width:min(90%,430px)
}
.panel h2{font-size:35px;margin-bottom:12px}
.panel h2 span{color:#43f5a0}
.panel p{color:#b8cbd8;line-height:1.6;margin:15px}
button{
 border:0;border-radius:10px;padding:13px 22px;
 background:#43f5a0;color:#062014;
 font-weight:bold;font-size:15px;cursor:pointer
}
button:active{transform:scale(.95)}
#bottom{
 display:flex;justify-content:space-between;
 color:#9eb5c9;padding:12px;font-size:12px
}
#mobile{display:none;justify-content:space-between;padding:8px}
.pad{display:grid;grid-template-columns:repeat(3,43px);gap:4px}
.pad button,.actions button{
 background:#183b50;color:white;padding:8px;
 touch-action:none
}
.actions{display:flex;gap:7px;align-items:center}
@media(max-width:650px){
 #bottom{display:none}
 #mobile{display:flex}
 h1{font-size:14px}
 #score{font-size:18px;padding:8px}
 #arena{width:100%}
}
</style>
</head>
<body>
<div id="app">
<header>
<h1>FOOTBALL <span>LEGENDS</span></h1>
<div id="score">BLUE <b id="bs">0</b> - <b id="rs">0</b> RED</div>
<div id="timer">02:00</div>
</header>

<div id="arena">
<canvas id="game" width="1000" height="620"></canvas>
<div id="menu">
 <div class="panel">
  <h2>FOOTBALL <span>LEGENDS</span></h2>
  <p>ARCADE EDITION<br>5 VS 5 · FAST FOOTBALL<br>¡Demostrá quién manda en la cancha!</p>
  <button id="play">JUGAR</button>
 </div>
</div>
</div>

<div id="bottom">
 <span>WASD: MOVER</span>
 <span>SHIFT: CORRER</span>
 <span>J: PASE</span>
 <span>K: DISPARAR</span>
 <span>Q: CAMBIAR</span>
 <span>ESC: PAUSA</span>
</div>

<div id="mobile">
 <div class="pad">
  <span></span><button data-key="ArrowUp">▲</button><span></span>
  <button data-key="ArrowLeft">◀</button>
  <button data-key="ArrowDown">▼</button>
  <button data-key="ArrowRight">▶</button>
 </div>
 <div class="actions">
  <button data-key="j">PASE</button>
  <button data-key="k">TIRO</button>
  <button data-key="Shift">SPRINT</button>
 </div>
</div>
</div>

<script>
const canvas=document.getElementById("game");
const c=canvas.getContext("2d");
const W=1000,H=620;
const keys={};
let blue=[],red=[];
let selected=1;
let scoreB=0,scoreR=0;
let time=120;
let active=false,paused=false;
let last=0,goalText="",goalEffect=0;
let actionCooldown=0;

const ball={x:500,y:310,vx:0,vy:0,owner:null};

const formations=[
 [[500,535],[330,430],[670,430],[400,290],[600,290]],
 [[500,85],[330,190],[670,190],[400,330],[600,330]]
];

function team(color,positions){
 return positions.map((p,i)=>({
  x:p[0],y:p[1],hx:p[0],hy:p[1],
  color,number:i+1,keeper:i===0
 }));
}

function setup(){
 blue=team("#087cff",formations[0]);
 red=team("#f23850",formations[1]);
 selected=1;
 reset();
}

function reset(){
 ball.x=500;ball.y=310;
 ball.vx=ball.vy=0;ball.owner=null;
 [...blue,...red].forEach(p=>{
  p.x=p.hx;p.y=p.hy;
 });
}

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

function drawField(){
 c.fillStyle="#102a20";c.fillRect(0,0,W,H);

 c.beginPath();
 c.moveTo(220,35);c.lineTo(780,35);
 c.lineTo(960,590);c.lineTo(40,590);
 c.closePath();
 c.fillStyle="#187d49";c.fill();

 // Franjas
 for(let i=0;i<10;i++){
  let y=35+i*55.5;
  let y2=y+55.5;
  let f=(y-35)/555,f2=(y2-35)/555;
  c.beginPath();
  c.moveTo(220-180*f,y);
  c.lineTo(780+180*f,y);
  c.lineTo(780+180*f2,y2);
  c.lineTo(220-180*f2,y2);
  c.closePath();
  c.fillStyle=i%2?"#ffffff09":"#00000009";
  c.fill();
 }

 c.strokeStyle="#ffffffcc";c.lineWidth=3;
 c.strokeRect(220,35,560,555);

 c.beginPath();c.moveTo(40,310);c.lineTo(960,310);c.stroke();

 c.beginPath();c.ellipse(500,310,105,55,0,0,Math.PI*2);c.stroke();

 c.beginPath();c.arc(500,310,5,0,7);c.fillStyle="white";c.fill();

 // Áreas
 c.strokeRect(350,35,300,95);
 c.strokeRect(350,495,300,95);
 c.strokeRect(420,35,160,40);
 c.strokeRect(420,550,160,40);

 // Arcos
 c.fillStyle="#e6f5ff";
 c.fillRect(425,12,150,12);
 c.fillRect(425,596,150,12);
}

function drawPlayer(p){
 const scale=.85+p.y/620*.2;
 const r=18*scale;

 c.fillStyle="#0006";
 c.beginPath();
 c.ellipse(p.x+4,p.y+8,r*1.2,r*.55,0,0,7);
 c.fill();

 c.beginPath();
 c.arc(p.x,p.y,r,0,7);
 c.fillStyle=p.color;
 c.fill();

 c.lineWidth=3;c.strokeStyle="#ffffff";
 c.stroke();

 c.beginPath();
 c.arc(p.x,p.y-r*.48,r*.48,0,7);
 c.fillStyle="#f4c69c";c.fill();

 c.fillStyle="white";
 c.font="bold 12px Arial";
 c.textAlign="center";
 c.fillText(p.number,p.x,p.y+5);

 if(p===blue[selected]&&active){
  c.beginPath();c.arc(p.x,p.y,r+8,0,7);
  c.strokeStyle="#57ffae";c.lineWidth=3;c.stroke();
  c.fillStyle="#57ffae";c.fillText("▼",p.x,p.y-r-13);
 }
}

function drawBall(){
 c.fillStyle="#0006";
 c.beginPath();c.ellipse(ball.x+4,ball.y+8,12,6,0,0,7);c.fill();

 c.beginPath();c.arc(ball.x,ball.y,9,0,7);
 c.fillStyle="white";c.fill();
 c.strokeStyle="#222";c.lineWidth=2;c.stroke();

 c.beginPath();c.arc(ball.x,ball.y,3,0,7);
 c.fillStyle="#222";c.fill();
}

function draw(){
 drawField();
 [...blue,...red].sort((a,b)=>a.y-b.y).forEach(drawPlayer);
 drawBall();

 if(goalEffect>0){
  c.fillStyle="#00150dcc";c.fillRect(0,220,1000,150);
  c.fillStyle="#43ffa0";c.font="bold 62px Arial";
  c.textAlign="center";c.fillText(goalText,500,310);
  c.fillStyle="white";c.font="20px Arial";
  c.fillText("¡GOOOOOOL!",500,345);
 }
}

function move(p,dx,dy,speed,dt){
 const l=Math.hypot(dx,dy)||1;
 p.x=clamp(p.x+dx/l*speed*dt,55,945);
 p.y=clamp(p.y+dy/l*speed*dt,18,602);
}

function nearest(team,target){
 return team.slice(1).reduce((a,b)=>dist(a,target)<dist(b,target)?a:b);
}

function human(dt){
 const p=blue[selected];
 let dx=0,dy=0;
 if(keys.w||keys.ArrowUp)dy--;
 if(keys.s||keys.ArrowDown)dy++;
 if(keys.a||keys.ArrowLeft)dx--;
 if(keys.d||keys.ArrowRight)dx++;
 move(p,dx,dy,keys.Shift?275:195,dt);
}

function ai(dt){
 for(let i=1;i<blue.length;i++){
  const p=blue[i];
  if(i===selected)continue;
  let tx=p.hx+(ball.x-500)*.22;
  let ty=p.hy+(ball.y-310)*.18;
  if(ball.owner===p){ty-=35}
  move(p,tx-p.x,ty-p.y,125,dt);
 }

 for(let i=1;i<red.length;i++){
  const p=red[i];
  let target=nearest(red,ball);
  let tx=p.hx+(ball.x-500)*.2;
  let ty=p.hy+(ball.y-310)*.2;
  if(target===p||!ball.owner){tx=ball.x;ty=ball.y}
  if(ball.owner===p)ty+=40;
  move(p,tx-p.x,ty-p.y,145,dt);
 }

 move(blue[0],clamp(ball.x,430,570)-blue[0].x,540-blue[0].y,125,dt);
 move(red[0],clamp(ball.x,430,570)-red[0].x,80-red[0].y,125,dt);
}

function shoot(p,power,dx,dy){
 const l=Math.hypot(dx,dy)||1;
 ball.owner=null;
 ball.x=p.x+dx/l*25;
 ball.y=p.y+dy/l*25;
 ball.vx=dx/l*power;
 ball.vy=dy/l*power;
 actionCooldown=.3;
}

function pass(){
 const p=blue[selected];
 if(ball.owner!==p)return;
 const target=blue.filter(x=>x!==p).sort((a,b)=>
  (p.y-a.y)*1.2-Math.abs(p.x-a.x)*.3 >
  (p.y-b.y)*1.2-Math.abs(p.x-b.x)*.3 ? -1:1
 )[0];
 if(target)shoot(p,390,target.x-p.x,target.y-p.y);
}

function kick(){
 const p=blue[selected];
 if(ball.owner!==p)return;
 shoot(p,650,500-p.x,-620);
}

function physics(dt){
 if(ball.owner){
  const p=ball.owner;
  ball.x=p.x;
  ball.y=p.y+(p.team==="red"?22:-22);
  return;
 }

 ball.x+=ball.vx*dt;
 ball.y+=ball.vy*dt;
 ball.vx*=Math.pow(.985,dt*60);
 ball.vy*=Math.pow(.985,dt*60);

 if(Math.abs(ball.vx)<3)ball.vx=0;
 if(Math.abs(ball.vy)<3)ball.vy=0;

 if(ball.x<55||ball.x>945){
  ball.x=clamp(ball.x,55,945);ball.vx*=-.8;
 }
 if(ball.y<15&&!(ball.x>420&&ball.x<580)){
  ball.y=15;ball.vy*=-.8;
 }
 if(ball.y>605&&!(ball.x>420&&ball.x<580)){
  ball.y=605;ball.vy*=-.8;
 }

 if(ball.y<20&&ball.x>420&&ball.x<580){
  scoreR++;goal("GOL ROJO");return;
 }
 if(ball.y>600&&ball.x>420&&ball.x<580){
  scoreB++;goal("GOLAZO");return;
 }

 for(const p of [...blue,...red]){
  if(dist(p,ball)<24){
   ball.owner=p;
   ball.vx=ball.vy=0;
   break;
  }
 }
}

function goal(text){
 goalText=text;goalEffect=2;
 document.getElementById("bs").textContent=scoreB;
 document.getElementById("rs").textContent=scoreR;
 ball.owner=null;ball.vx=ball.vy=0;
 setTimeout(()=>{if(active)reset()},1100);
}

function update(dt){
 if(!active||paused)return;
 if(goalEffect>0)goalEffect-=dt;
 if(actionCooldown>0)actionCooldown-=dt;

 time-=dt;
 if(time<=0){
  time=0;active=false;
  document.getElementById("menu").style.display="flex";
  document.querySelector(".panel p").innerHTML=
   "FINAL DEL PARTIDO<br>"+scoreB+" - "+scoreR;
  document.getElementById("play").textContent="JUGAR DE NUEVO";
  return;
 }

 const mm=Math.floor(time/60);
 const ss=Math.floor(time%60);
 document.getElementById("timer").textContent=
  String(mm).padStart(2,"0")+":"+String(ss).padStart(2,"0");

 human(dt);ai(dt);

 if(ball.owner){
  const rivals=ball.owner.team==="red"?blue:red;
  for(const r of rivals){
   if(dist(r,ball.owner)<22&&Math.random()<.12){
    ball.owner=null;
    ball.vx=(ball.x-r.x)*8;
    ball.vy=(ball.y-r.y)*8;
    break;
   }
  }
 }

 physics(dt);
}

function loop(t){
 const dt=Math.min((t-last)/1000||0,.035);
 last=t;
 update(dt);draw();
 requestAnimationFrame(loop);
}

function start(){
 scoreB=scoreR=0;time=120;
 paused=false;active=true;
 setup();
 document.getElementById("bs").textContent=0;
 document.getElementById("rs").textContent=0;
 document.getElementById("timer").textContent="02:00";
 document.getElementById("menu").style.display="none";
}

document.getElementById("play").onclick=start;

document.addEventListener("keydown",e=>{
 let k=e.key.length===1?e.key.toLowerCase():e.key;
 if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();
 if(!keys[k]){
  if(k==="j")pass();
  if(k==="k")kick();
  if(k==="q")selected=selected%4+1;
  if(k==="Escape"&&active)paused=!paused;
 }
 keys[k]=true;
});
document.addEventListener("keyup",e=>{
 keys[e.key.length===1?e.key.toLowerCase():e.key]=false;
});

document.querySelectorAll("[data-key]").forEach(b=>{
 const k=b.dataset.key;
 b.addEventListener("pointerdown",e=>{
  e.preventDefault();
  if(k==="j")pass();
  else if(k==="k")kick();
  else keys[k]=true;
 });
 ["pointerup","pointerleave","pointercancel"].forEach(ev=>
  b.addEventListener(ev,()=>keys[k]=false)
 );
});

setup();
draw();
requestAnimationFrame(loop);
</script>
</body>
</html>
